context:
  version: "6.11.3"

  # While this is typically "major and minor" on PySide 6.8.0
  # There were two "emergency" releases 6.8.0.1 and 6.8.0.2 that came out quickly
  # and revealed that this number can contain a 3rd number under the right circumstances
  maj_min: ${{ (version | split('.'))[:-1] | join('.') }}
  maj_min_patch: ${{ (version | split('.'))[:3] | join('.') }}

package:
  name: pyside6
  version: ${{ version }}

source:
  git: https://github.com/qtproject/pyside-pyside-setup.git
  tag: v${{ version }}

  patches:
    # https://bugreports.qt.io/browse/PYSIDE-1193
    - patches/pyi_osx.patch
    - patches/qfp_osx.patch

    # https://bugreports.qt.io/browse/PYSIDE-2057
    - patches/do_not_store_build_time_compiler.patch

    # change tools module location
    - patches/tools.patch

    # fix includes https://qt-project.atlassian.net/browse/PYSIDE-3306
    - patches/d252378.patch
    - patches/71c4d17.patch

    # https://qt-project.atlassian.net/browse/PYSIDE-3516
    - patches/install_py_typed.patch
    
    # normalize .pc paths to forward slashes on Windows (mixed separators
    # break prefix replacement); propose upstream
    - patches/pc_forward_slashes.patch

build:
  number: 1
  python:
    version_independent: true
    entry_points:
      - pyside6-rcc = PySide6.scripts.pyside_tool:rcc
      - pyside6-uic = PySide6.scripts.pyside_tool:uic
    skip_pyc_compilation:
      # SyntaxError in jinja template
      - "*/__init__.tmpl.py"

requirements:
  build:
    - cmake
    - ninja
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - if: build_platform != target_platform
      then:
        - python-abi3 ${{ python_min }}.*
        - python ${{ python_min }}.*
        - cross-python_${{ target_platform }}
        - setuptools
        - libxslt
        - libxml2-devel
        - qt6-main ${{ maj_min_patch }}.*
        - if: not osx
          then:
            - libclang
            - llvmdev
            - clangdev
    - if: osx and (build_platform != target_platform)
      then:
        - llvmdev ${{ cxx_compiler_version }}.*
        - clangdev ${{ cxx_compiler_version }}.*
        - libcxx ${{ cxx_compiler_version }}.*
        - libclang ${{ cxx_compiler_version }}.*

  host:
    - python-abi3 ${{ python_min }}.*
    - python ${{ python_min }}.*
    - setuptools
    - libxslt
    - libxml2-devel
    - qt6-main ${{ maj_min_patch }}.*
    - qt6-3d
    - qt6-charts
    - qt6-datavis3d
    - qt6-graphs
    # Provides QtMultimediaWidgets and QtSpatialAudio
    - qt6-multimedia
    - qt6-networkauth
    - qt6-quick3d
    # Provides QtScxml and QtStateMachine
    - qt6-scxml
    - qt6-sensors
    - qt6-serialport
    # qt-webengine is not built on osx-x86_64
    - if: not (osx and x86_64)
      then:
        - qt6-webengine
    - if: not osx
      then:
        - llvmdev
        - clangdev
        - libclang
    - if: linux
      then:
        - qt6-wayland
        - libgl-devel
        - libegl-devel
        - libopengl-devel
    - if: osx
      then:
        - llvmdev  ${{ cxx_compiler_version }}.*
        - clangdev ${{ cxx_compiler_version }}.*
        - libcxx  ${{ cxx_compiler_version }}.*
        - libclang  ${{ cxx_compiler_version }}.*
      else:
        - libvulkan-headers
        - libvulkan-loader
  run:
    - python >=${{ python_min }}
    - qt6-main ${{ maj_min_patch }}.*
  ignore_run_exports:
    from_package:
      # make these optional for slimmer downloads and licensing choice
      - qt6-3d
      - qt6-charts
      - qt6-datavis3d
      - qt6-graphs
      - qt6-wayland
      - qt6-multimedia
      - qt6-networkauth
      - qt6-quick3d
      - qt6-scxml
      - qt6-sensors
      - qt6-serialport
      - qt6-webengine

tests:
  - python:
      imports:
        #- PySide6.QtBluetooth
        - PySide6.QtConcurrent
        - PySide6.QtCore
        - PySide6.QtDesigner
        - PySide6.QtGui
        - PySide6.QtHelp
        #- PySide6.QtHttpServer
        - PySide6.QtNetwork
        #- PySide6.QtNfc
        - PySide6.QtOpenGL
        - PySide6.QtOpenGLWidgets
        #- PySide6.QtPdf
        #- PySide6.QtPdfWidgets
        # - PySide6.QtPositioning
        - PySide6.QtPrintSupport
        - PySide6.QtQml
        - PySide6.QtQuick
        - PySide6.QtQuickControls2
        - PySide6.QtQuickWidgets
        #- PySide6.QtRemoteObjects
        # - PySide6.QtSensors
        - PySide6.QtSql
        - PySide6.QtSvg
        - PySide6.QtSvgWidgets
        - PySide6.QtTest
        #- PySide6.QtTextToSpeech
        - PySide6.QtUiTools
        - PySide6.QtWebChannel
        - PySide6.QtWebSockets
        - PySide6.QtWidgets
        - PySide6.QtXml
  - package_contents:
      site_packages:
        - shiboken6
        - PySide6
      files:
        exists:
          # shiboken6 binary: bin/shiboken6(.exe) on Windows, but staged as
          # python-scripts/shiboken6 in noarch (abi3) tarballs on Unix
          # (mapped back to bin/ on install); `shiboken6 --help` below
          # checks the installed location
          - "**/shiboken6*"
          # Qt Designer plugin
          - "**/plugins/designer/*PySidePlugin*"
          # installed by patches/install_py_typed.patch
          - "**/PySide6/py.typed"
          - "**/PySide6/__feature__.pyi"
        not_exists:
          # Regression to avoid clobber with qt-main package
          - bin/uic
          - Library/bin/uic.exe
  - script:
      - shiboken6 --help
      - pyside6-rcc -help
      - pyside6-uic -help
    # Star imports have broken many times on PySide6
    # https://github.com/spyder-ide/qtpy/issues/494
    # https://github.com/spyder-ide/qtpy/issues/480
    # We add it here for safety so we don't release really broken packages
      - python -c "import PySide6; from PySide6.QtCore import *"
    # qt-webengine is not built on osx-x86_64
      - if: not (osx and x86_64)
        then:
          - python -c "import PySide6.QtWebEngineCore"
          - python -c "import PySide6.QtWebEngineQuick"
          - python -c "import PySide6.QtWebEngineWidgets"
    requirements:
      run:
        # these are optional
        - qt6-3d
        - qt6-charts
        - qt6-datavis3d
        - qt6-graphs
        - qt6-multimedia
        - qt6-networkauth
        - qt6-scxml
        - qt6-sensors
        - qt6-serialport
        - if: not (osx and x86_64)
          then:
            - qt6-webengine

about:
  homepage: https://wiki.qt.io/PySide2
  license: LGPL-3.0-only
  license_file: LICENSES/LGPL-3.0-only.txt
  summary: Python bindings for Qt

extra:
  recipe-maintainers:
    - jan-janssen
    - jschueller
